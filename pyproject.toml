[project]
name = "churn-retention-agent"
version = "0.1.0"
description = "Agente de retención anti-churn con human-in-the-loop: modelo de propensión calibrado + agente LLM que razona sobre economía de ofertas (EV = P(retener)·CLTV − costo)."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Victor Manuel Lugo Ramirez", email = "victorlr9412@gmail.com" },
]
keywords = ["churn", "retention", "llm-agent", "ml", "telco"]
dependencies = [
    "fastapi[standard]>=0.115",
    "imbalanced-learn>=0.12",
    "langchain-anthropic>=0.3",
    "langchain-core>=0.3",
    "langgraph>=0.2.57",
    "lightgbm>=4.5",
    "pandas>=3.0.3",
    "pandera>=0.32.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "scikit-learn>=1.9.0",
    "shap>=0.46",
    "uvicorn[standard]>=0.30",
]

[project.urls]
Homepage = "https://github.com/victorlr/churn-retention-agent"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.7",
    "pandas-stubs>=3.0.3.260530",
    "httpx>=0.27",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "churn_agent"
module-root = "src"

# ----------------------------------------------------------------------------
# Calidad de código (skill: python-code-quality)
# ----------------------------------------------------------------------------
[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM"]
# N803/N806: X mayúscula es convención matemática estándar en ML (feature matrix).
ignore = ["N803", "N806"]

[tool.ruff.lint.per-file-ignores]
# Scripts CLI: líneas largas en mensajes de usuario son aceptables.
"scripts/*.py" = ["E501"]
# X mayúscula es convención matemática estándar para la matriz de features.
"tests/**/*.py" = ["N802"]

[tool.ruff.format]
docstring-code-format = true

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

# Estricto en el núcleo reutilizable
[[tool.mypy.overrides]]
module = "churn_agent.*"
strict = true

# pandera usa metaclases y runtime magic; sus internals no satisfacen strict
[[tool.mypy.overrides]]
module = "churn_agent.data.*"
strict = false
disallow_untyped_defs = true
warn_return_any = true

# Relajado en tests (pytest.mark.* son decoradores dinámicos, no tipables)
[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_decorators = false

# sklearn no distribuye stubs ni py.typed
[[tool.mypy.overrides]]
module = "sklearn.*"
ignore_missing_imports = true

# lightgbm y shap tampoco distribuyen stubs
[[tool.mypy.overrides]]
module = "lightgbm.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "shap.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "joblib.*"
ignore_missing_imports = true

# model usa sklearn pipelines cuyas firmas no satisfacen strict
[[tool.mypy.overrides]]
module = "churn_agent.model.*"
strict = false
disallow_untyped_defs = true
warn_return_any = true

# Relajado en exploración
[[tool.mypy.overrides]]
module = "notebooks.*"
ignore_errors = true

# langgraph y langchain no distribuyen stubs completos
[[tool.mypy.overrides]]
module = "langgraph.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "langchain_core.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "langchain_anthropic.*"
ignore_missing_imports = true

# api, agent y economics usan FastAPI/LangGraph/sklearn sin tipos completos
[[tool.mypy.overrides]]
module = "churn_agent.api.*"
strict = false
disallow_untyped_defs = true
disallow_untyped_decorators = false
warn_return_any = true

[[tool.mypy.overrides]]
module = "churn_agent.agent.*"
strict = false
disallow_untyped_defs = true
disallow_untyped_decorators = false
warn_return_any = true
warn_unused_ignores = false

[[tool.mypy.overrides]]
module = "churn_agent.economics.*"
strict = false
disallow_untyped_defs = true
warn_return_any = true

# ----------------------------------------------------------------------------
# Testing (skill: testing-strategy)
# ----------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov=churn_agent --cov-report=term-missing"
markers = [
    "unit: pruebas unitarias rápidas y deterministas",
    "integration: pruebas que cruzan componentes",
    "security: pruebas de guardrails y casos adversariales",
]

[tool.coverage.run]
branch = true
source = ["src/churn_agent"]
